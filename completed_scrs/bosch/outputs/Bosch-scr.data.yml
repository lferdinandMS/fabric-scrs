# SCR Risk Types
risk:
  slas:
    status: extracted
    value: |
      No Microsoft SLAs or OLAs are offered. The ESWO (WO UCM0265-499493-645827) is a
      fixed-fee, milestone-billed Work Order: "Any total fee stated is an estimate only,"
      fees exclude Products/licenses, and Customer pays within 30 days of invoice. The SOW
      adds an Agile fixed-capacity / variable-scope model — the project is deemed complete
      when capacity is consumed or the WO term (7/6/2026–1/8/2027) expires. Termination for
      convenience requires 60 days' notice; a delay to the Consulting Commencement Date
      without ≥10 business days' notice can expose Customer to up to the full fee. No
      customer-side SLAs are in scope. Underlying Azure service-level terms apply to the
      Azure subscription at the product level only.
    sources: [3, 4]
  cloud_integration:
    status: extracted
    value: |
      The Online path uses Azure AI Foundry (GPT-family LLM, STT, TTS via Azure OpenAI API)
      and Azure subscription infrastructure (CAF Enterprise-Scale Landing Zone). No non-Azure
      cloud services are in scope. Third-party API integrations (e.g., mapping, POI, media)
      are a future-phase item — the SOW notes "3rd Party APIs need to be prepared by Bosch"
      and modifications to third-party systems are out of scope for Microsoft. The CES demo
      scope is agreed in Sprint 0; connector-level complexity is deferred to that sprint.
      Offline components (SLMs, STT, TTS, wake-word, vector DB) run entirely on the edge
      device with no cloud dependency, so there is no Fabric or data-pipeline connector risk.
    sources: [3, 4]
  workloads_summary:
    status: extracted
    value: |
      This is an Agile, 26-week engagement (ESWO contracted ~$3.56M + ~$140K T&E; staffing
      plan ~$6.5M) to build an In-Car Voice Assistant for Bosch targeting the CES demo. The
      solution spans an edge (offline) path — custom SLMs, STT, TTS, and wake-word/VAD models
      fine-tuned on a 50–150+ TOPs AI Box — and an online path via Azure AI Foundry (GPT-family
      LLM, Azure OpenAI STT/TTS). An edge-native arbitrator routes requests between offline and
      online agents. Supporting workloads include a Vehicle Manual RAG (local vector DB), user
      memory manager, STS emotion/tone, automated test framework, Azure Landing Zone, DevOps/
      MLOps CI-CD, RAI review, and Delivery Compliance/Privacy/Security (SBD). Microsoft Fabric
      is not referenced in the SOW or ESWO.
    sources: [3, 4]
  isvs:
    status: extracted
    value: |
      No ISV/partner named in the SOW or ESWO for delivery. Bosch has its own Development and
      Test Team working alongside Microsoft. Third-party API providers (e.g., for mapping,
      media, calendar) are referenced as Bosch's responsibility ("3rd Party APIs need to be
      prepared by Bosch") and are out of scope for Microsoft integration during this SOW.
    sources: [3, 4]
  non_ga:
    status: verified
    value: |
      The online path relies on Azure OpenAI models via Azure AI Foundry (Microsoft Foundry).
      The core GA models suitable for production use are: gpt-4o (2024-11-20), gpt-4o-mini,
      gpt-5 family (gpt-5, gpt-5-mini, gpt-5-nano), GPT-4.1 series, and o-series (o3, o4-mini)
      — all GA, Azure-SLA-covered, billed through Azure subscription [1].
      Azure OpenAI Whisper (STT) is GA [1]. gpt-4o-mini-tts (TTS) is GA [1].
      Several newer/preview models exist (gpt-5-chat, gpt-chat-latest, gpt-5.3-chat, etc.)
      — Microsoft explicitly cautions against using preview models in production [1].
      Recommendation: For the CES demo (non-production) any GA or preview model is acceptable;
      if the engagement progresses to production deployment, pin to GA model versions only.
      The offline SLMs (wake-word, STT, TTS, SLM) are custom-trained models on the edge device
      — not Azure-hosted services — so Azure product GA/preview classifications do not apply.
      No non-GA product dependencies are a current blocker; preview-model risk is confined to
      the online Azure AI path and is bounded by the non-production CES demo scope.
    sources: [1, 2]

