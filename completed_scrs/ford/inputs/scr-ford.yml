# Fabric SCR — per-deal configuration
#
# This file supplies ONLY the deterministic, config-sourced facts. The agent
# combines three tiers of input to build the SCR:
#
#   1. CONFIG-SOURCED     (this file)      → Opportunity Overview, Pre-Conditions
#   2. DOCUMENT-EXTRACTED (the SOW .docx)  → Project Overview, SCR Risk Types,
#                                            workloads — via a thorough review
#   3. SYNTHESIZED        (agent-generated)→ Review Summary, Key Points,
#                                            Key Risk Factors
#
# Do NOT put workloads / risk narrative here — those are extracted from the SOW.

# --- Document identity (drives the output filename) ---
customer: "Ford Motor Company"          # used in filename + H1
customer_short: "Ford"                  # used in filename: Fabric-SCR-<customer_short>-<date>
engagement_name: "Agentic AI Transformation"
date: "2026-06-06"                       # review date; filename uses YYYYMMDD

# --- Source inputs (the document-extracted tier reads these) ---
inputs:
  sow_docx: "completed_scrs/ford/inputs/DRAFT_NOT BINDING_Statement of Work_Ford_Agentic Al Transformation_v4_June 03, 2026 - Copy.docx"
  supporting:
    - "completed_scrs/ford/inputs/Ford - Staffing Plan - Agent Implementation - 05 18 2026 - PRE SRM - Copy.xlsx"
    - "completed_scrs/ford/inputs/FORD-FabricSCR-CompassScreenshot.png"

# --- Opportunity overview (CONFIG-SOURCED) ---
opportunity:
  msx_id: "7-3FS2XQBWAO"                 # CRM / MSX Opportunity ID
  crm_account_id: "11-22J0X"
  tpid: "639534"
  c1url: "https://compass.microsoft.com/opportunities/7-3FS2XQBWAO/639534"  # optional link to Compass One opportunity
