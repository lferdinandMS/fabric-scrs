review_summary:
  status: synthesized
  value: |
    Ford – Agentic AI Transformation is a ~$3.91M, 26-week (5.9-month) ESWO pilot with
    Fabric in scope and a production-pilot component, so it meets the Pre-Conditions for
    a Special Conditions Review while sitting below the $10M automatic-SCR threshold.
    Overall risk is moderate and typical for an early Agentic AI pilot. The platform
    rests on generally-available, Azure-SLA-covered foundations (Microsoft Fabric/OneLake,
    Azure AI Foundry, GPT-5 family), and the engagement deliberately limits exposure:
    prototypes are non-production with sample/stubbed-data fallbacks, the production
    deployment is capped at <20 pilot users, and SLAs/OLAs are expressly out of scope.
    The principal residual risk is a light confirmation that no production Fabric
    pipeline hardening is expected in the deployment phase — the Fabric-heavy use cases
    are non-production prototypes that fall inside the staffed build window, and the
    data-engineering work is owned by Microsoft IGD.
    This is not a blocker given the pilot scope, but warrants confirmation before build.

