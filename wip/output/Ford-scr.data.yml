# SCR Risk Type: Fabric — each risk carries its own status + source citations.
risk:
  slas:
    status: verified
    value: |
      No Microsoft SLAs/OLAs are offered by this engagement. The SOW's Exclusions
      table expressly places "Guarantees and SLAs/OLAs" out of scope: no commitments
      on system performance, uptime, or service levels are provided or implied [4].
      Underlying platform SLAs still apply at the product level — Microsoft Fabric is
      generally available, runs across Azure availability zones, and offers
      cross-region disaster recovery for OneLake data, covered by Azure's standard
      service-level terms [1][2]. No customer-side SLAs are in scope.
    sources: [1, 2, 4]
  cloud_integration:
    status: extracted
    value: |
      Integrations in scope: SAP Ariba, ServiceNow/Dynatrace (outage/SLA events),
      SharePoint (PDF document access), and Microsoft Fabric/OneLake. Assumed reachable
      via out-of-the-box Copilot / Power Automate connectors; otherwise sample files
      are used for demonstration/validation. Real-time Dynatrace/ServiceNow integration
      (UC1) depends on customer-provided API credentials (SOW prereq #6) and falls back
      to stubbed data if blocked at Week 1. The actual prototype sources are limited to
      four named systems, all native or pre-mitigated: UC1 draws on SharePoint (SLA
      contract PDFs — native connector), Dynatrace and ServiceNow (outage events; native
      ServiceNow connector, Dynatrace via REST with stubbed-data fallback), landing in
      Microsoft Fabric/OneLake; UC2 draws on SharePoint (vendor quotes/contracts — native
      connector) and SAP Ariba (supplied as a CSV extract, explicitly in place of API
      integration), with approved-record lookup in OneLake. None of the no-native-connector
      systems (Oracle HCM, Teamcenter, Nicus) appear in UC1/UC2 — those are evaluated/
      referenced only (NOT integrated): GCP, BigQuery, Teamcenter, Oracle HCM, Nicus,
      GitHub, Jira/Confluence/Atlassian. Connector-availability complexity is therefore a
      conditional, future-phase concern (if any referenced source is promoted in-scope it
      becomes a custom-integration workstream), not a current-scope risk. The prototype
      validates agent behaviour against stubbed Dynatrace events and an SAP Ariba CSV
      extract rather than live integrations, so a future production phase must independently
      scope and estimate those data paths — particularly SAP Ariba, which has no native
      connector — and should not treat pilot success as evidence of production-integration
      feasibility or sizing; the deferred complexity (live REST auth, throttling/retry,
      schema-drift handling, event-volume/F8-capacity load) is bounded to that future phase,
      not eliminated. Fabric Eventstream
      connectors for Kafka/Service Bus and SQL-estate CDC reached GA in 2026 [1][5].
    sources: [1, 5]
  workloads_summary:
    status: synthesized
    value: |
      A 26-week pilot building a reusable Agentic AI platform on Copilot Studio and
      Azure AI Foundry (Microsoft Foundry): up to 2 non-production prototype agents
      (KPMG-built), up to 2 department agents, and 1 production-pilot department agent
      (Engineering & Product Development) for <20 North American users. Microsoft Fabric
      (F8) provides OneLake storage, data pipelines, and eventstream ingestion under
      the solution, with Azure AI Search (RAG), Document Intelligence, Logic Apps, and
      a React/Static Web Apps human-in-the-loop UI.
    sources: []
  isvs:
    status: extracted
    value: |
      The only ISV/partner engaged on delivery is KPMG — the Microsoft partner
      subcontracted to build the two non-production prototype use cases (UC1 Supplier
      Downtime & SLA Credit Automation; UC2 Vendor Quote & Contract Document Management
      Analysis), ~2,088 hours / ~$442K of the deal, time-boxed to weeks 3–10. KPMG is
      the relevant entity here because it is the one carrying partner-delivery and
      scope-attribution exposure; that exposure is bounded by the non-production scope
      (sample/stubbed-data fallbacks, no production-hardening obligations).
    sources: [4]
  non_ga:
    status: verified
    value: |
      Core platform is GA: Microsoft Fabric (OneLake, Data Factory pipelines,
      Eventstream, F-SKU capacity) is generally available and Azure-SLA-covered [1][2].
      No non-GA or preview-stage product dependencies remain in scope.
    sources: [1, 2]

