# Fabric SCR — per-deal configuration
#
# Copy this to wip/inputs/<deal>.yml, fill it in, and point the Fabric SCR agent at it.
#
# This file supplies ONLY the deterministic, config-sourced facts. The agent
# combines three tiers of input to build the SCR:
#
#   1. CONFIG-SOURCED     (this file)      → Opportunity Overview, Pre-Conditions
#   2. DOCUMENT-EXTRACTED (the SOW .docx)  → Project Overview, SCR Risk Types,
#                                            workloads — via a thorough review
#   3. SYNTHESIZED        (agent-generated)→ Review Summary, Key Points,
#                                            Key Risk Factors
#
# Do NOT put workloads / risk narrative here — those are extracted from the SOW.

# --- Document identity (drives the output filename) ---
customer: "<< Customer legal name >>"      # used in filename + H1
customer_short: "<< Short >>"              # used in filename: Fabric-SCR-<customer_short>-<date>
engagement_name: "<< Engagement name >>"
date: "<< YYYY-MM-DD >>"                    # review date; filename uses YYYYMMDD

# --- Source inputs (the document-extracted tier reads these) ---
inputs:
  sow_docx: "wip/inputs/<< Statement of Work .docx >>"
  supporting:
    - "wip/inputs/<< Staffing plan .xlsx, CompassOne screenshot, etc. >>"

# --- Opportunity overview (CONFIG-SOURCED) ---
opportunity:
  msx_id: "<< 7-XXXXXXXX >>"               # CRM / MSX Opportunity ID
  crm_account_id: "<< 11-XXXXX >>"
  tpid: "<< 000000 >>"
  c1url: "<< https://compass.microsoft.com/opportunities/... >>"
  compass_one:
    deal_type: "<< ESWO / ECIF / ... >>"
    deal_owner: "<< Name >>"
    stage: "<< Contracting / ... >>"
    target_approval_date: "<< YYYY-MM-DD >>"
    reviews_required: false

# --- Team (CONFIG-SOURCED reviewer identities; agent merges SOW-prepared-by from the .docx) ---
team:
  architect: "<< Confirm name / alias >>"   # ISD Solution Architect (override if known)
  eag: "<< EAG reviewer alias >>"           # EAG reviewer running this SCR

# --- Commercials / pre-conditions (CONFIG-SOURCED; drives the Yes/No Pre-Conditions) ---
commercials:
  deal_value_usd: 0                          # total deal value in USD
  fabric_in_scope: true
  production_pilot: false
  sold_margin_pct: 0
  duration: "<< e.g. 5.9-month (26-week) >>"
  engagement_dates: "<< YYYY-MM-DD – YYYY-MM-DD >>"
  # The $10M threshold check is derived from deal_value_usd by the agent.

# --- Output options ---
output:
  generate_docx: true                        # run pandoc to produce the styled .docx
  reference_template: "templates/Fabric-SCRTemplate-20250605.docx"
